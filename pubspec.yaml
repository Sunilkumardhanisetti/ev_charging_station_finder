publish_to: 'none'

# Define the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  http: ^1.2.2
  location: ^7.0.1
  sqflite: ^2.4.1
  path: ^1.9.0
  connectivity_plus: ^6.1.3
  workmanager: ^0.5.2
  cloud_firestore: ^5.6.6



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  lint: ^2.3.0
  flutter_native_splash: ^2.0.2

flutter:
